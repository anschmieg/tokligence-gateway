services:
  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - gateway-data:/data
    environment:
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - OLLAMA_API_BASE=${OLLAMA_API_BASE:-https://ollama.com/v1}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_API_BASE=${OPENROUTER_API_BASE:-https://openrouter.ai/api/v1}
      - MISTRAL_ENABLED=${MISTRAL_ENABLED:-false}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_API_BASE=${MISTRAL_API_BASE:-}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - TOKLIGENCE_AUTH_SECRET=${TOKLIGENCE_AUTH_SECRET}
      - TOKLIGENCE_ADMIN_SECRET=${TOKLIGENCE_ADMIN_SECRET}
      - CODEX_PROXY_ENABLED=${CODEX_PROXY_ENABLED:-false}
      - CODEX_AUTO_DEVICE_LOGIN=${CODEX_AUTO_DEVICE_LOGIN:-false}
      - CODEX_PROXY_BASE_URL=${CODEX_PROXY_BASE_URL:-}
      - CODEX_PROXY_API_KEY=${CODEX_PROXY_API_KEY:-}
      - ROUTING_CONFIG_PATH=${ROUTING_CONFIG_PATH:-/app/gateway.routes.yaml}

volumes:
  gateway-data:
