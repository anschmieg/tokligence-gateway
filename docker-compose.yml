services:
  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - gateway-data:/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_API_BASE=${MINIMAX_API_BASE:-https://api.minimax.io/anthropic}
      - MODAL_GLM5_API_BASE=${MODAL_GLM5_API_BASE}
      - MODAL_GLM5_API_KEY=${MODAL_GLM5_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - TOKLIGENCE_AUTH_SECRET=${TOKLIGENCE_AUTH_SECRET}
      - CODEX_PROXY_ENABLED=${CODEX_PROXY_ENABLED:-false}
      - CODEX_PROXY_BASE_URL=${CODEX_PROXY_BASE_URL:-}
      - CODEX_PROXY_API_KEY=${CODEX_PROXY_API_KEY:-}
      - CODEX_MODELS=${CODEX_MODELS:-gpt-5.6-luna,gpt-5.6-terra,gpt-5.6-sol}
      - CODEX_HAIKU_MODEL=${CODEX_HAIKU_MODEL:-gpt-5.6-luna}
      - CODEX_SONNET_MODEL=${CODEX_SONNET_MODEL:-gpt-5.6-terra}
      - CODEX_OPUS_MODEL=${CODEX_OPUS_MODEL:-gpt-5.6-sol}
      - CODEX_FABLE_MODEL=${CODEX_FABLE_MODEL:-gpt-5.6-sol}

volumes:
  gateway-data:
