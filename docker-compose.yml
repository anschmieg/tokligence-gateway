services:
  gateway:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - gateway-data:/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      - MINIMAX_API_BASE=${MINIMAX_API_BASE:-https://api.minimax.io/anthropic}
      - MODAL_GLM5_API_BASE=${MODAL_GLM5_API_BASE}
      - MODAL_GLM5_API_KEY=${MODAL_GLM5_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - MISTRAL_API_BASE=${MISTRAL_API_BASE:-https://api.mistral.ai/v1}
      - TOKLIGENCE_AUTH_SECRET=${TOKLIGENCE_AUTH_SECRET}
      - TOKLIGENCE_ADMIN_SECRET=${TOKLIGENCE_ADMIN_SECRET}
      - CODEX_PROXY_ENABLED=${CODEX_PROXY_ENABLED:-false}
      - CODEX_AUTO_DEVICE_LOGIN=${CODEX_AUTO_DEVICE_LOGIN:-false}
      - CODEX_PROXY_BASE_URL=${CODEX_PROXY_BASE_URL:-}
      - CODEX_PROXY_API_KEY=${CODEX_PROXY_API_KEY:-}
      - ROUTING_CONFIG_PATH=${ROUTING_CONFIG_PATH:-/app/gateway.routes.yaml}
      - CLOUDFLARE_ACCESS_TEAM=${CLOUDFLARE_ACCESS_TEAM:-}
      - CLOUDFLARE_ACCESS_AUD=${CLOUDFLARE_ACCESS_AUD:-}
      - CLOUDFLARE_ACCESS_JWKS_URL=${CLOUDFLARE_ACCESS_JWKS_URL:-}
      - CLOUDFLARE_ACCESS_CERTS=${CLOUDFLARE_ACCESS_CERTS:-}

volumes:
  gateway-data:
