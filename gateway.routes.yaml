version: 1

# This is the single source of truth for providers, models, aliases, and routing.
# Secrets stay in Coolify and are referenced here by environment-variable name.
# Quota-based providers have metadata for smart routing.
access:
  public_secret_env: TOKLIGENCE_AUTH_SECRET
  admin_secret_env: TOKLIGENCE_ADMIN_SECRET

# Class-based model substitution: delegated (subagent/workflow) and auxiliary
# turns try a cheap target first, then fall back to the session profile chain.
# The target needs a documented context window at or above the profile floor;
# Mistral Medium 3.5 is 256k, so the 128k agent profiles qualify. Direct Codex
# model requests are not profile requests and keep their own lane.
classRouting:
  enabled: true
  cheapPolicyModel:
    provider: mistral
    model: mistral-medium-3-5

providers:
  - id: tokligence
    adapter: tokligence
    default: true
    upstreams:
      anthropic:
        api_key_env: MINIMAX_API_KEY
        base_url_env: MINIMAX_API_BASE
        default_base_url: https://api.minimax.io/anthropic
      openai:
        api_key_env: OPENAI_API_KEY
        base_url_env: OPENAI_API_BASE
        default_base_url: https://api.openai.com/v1
    models: [minimax-m2.1, minimax-m2.5, minimax-m2.7]
    metadata:
      cost_class: subscription
      capabilities: [coding, reasoning]
      quota_type: subscription

  - id: codex-oauth
    adapter: oauth-proxy
    enabled_env: CODEX_PROXY_ENABLED
    internal_api_key_env: CODEX_PROXY_API_KEY
    external_base_url_env: CODEX_PROXY_BASE_URL
    auth_dir: /data/cliproxy/auth
    models:
      - id: gpt-5.6-luna
        family: openai
        context_window: 1050000
      - id: gpt-5.6-terra
        family: openai
        context_window: 1050000
      - id: gpt-5.6-sol
        family: openai
        context_window: 1050000
      - id: gpt-6-luna
        family: openai
        context_window: 1050000
      - id: gpt-6-sol
        family: openai
        context_window: 1050000
    credential_pool:
      strategy: round-robin
      session_affinity: true
      session_affinity_ttl: 1h
      request_retry: 1
      max_retry_credentials: 2
      max_retry_interval: 30
    metadata:
      cost_class: subscription
      capabilities: [coding, reasoning, tool_calling]
      quota_type: subscription

  - id: chatgpt-specialist
    adapter: chatgpt-responses
    enabled_env: CHATGPT_RESPONSES_ENABLED
    api_key_env: CHATGPT_SERVICE_TOKEN
    base_url_env: CHATGPT_SERVICE_URL
    protocols: [responses, messages, chat_completions]
    models:
      - id: ui-text
        family: chatgpt-ui
        context_window: 16000
    metadata:
      capabilities: [text]
      streaming: true

  - id: copilot-auto
    adapter: copilot-sdk
    enabled_env: COPILOT_AUTO_ENABLED
    models:
      - id: copilot-auto
        family: github
        context_window: 272000
    metadata:
      cost_class: subscription
      capabilities: [coding, reasoning, tool_calling]
      quota_type: subscription

  - id: cline-oauth
    adapter: cline-oauth
    default_base_url: https://api.cline.bot
    api_base_url_env: CLINE_API_BASE_URL
    default_workos_base_url: https://api.workos.com
    workos_base_url_env: CLINE_WORKOS_BASE_URL
    credentials_path: /data/cline-oauth/credentials.json
    credentials_path_env: CLINE_OAUTH_CREDENTIALS_PATH
    request_timeout_ms: 30000
    refresh_buffer_ms: 300000
    model_cache_ttl_ms: 300000
    discover_models: true
    models: []
    metadata:
      cost_class: free
      capabilities: [coding, reasoning, tool_calling]
      quota_type: free_tier

  # === NEUE PROVIDER (Quota-basiert) ===
  - id: mistral
    adapter: middleware
    billing_class: subscription
    api_key_env: MISTRAL_API_KEY
    base_url_env: MISTRAL_API_BASE
    default_base_url: https://api.mistral.ai/v1
    # Mistral exposes only an OpenAI-compatible chat-completions API; /v1/messages
    # is served through the shared Anthropic<->chat-completions translation, which
    # carries tools, images and streaming. Declaring `messages` here would make the
    # planner treat the surface as native and skip that translation.
    protocols: [chat_completions]
    discover_models: true
    models:
      - id: mistral-large-latest
        family: mistral
      - id: mistral-small-latest
        family: mistral
      - id: mistral-medium-3-5
        family: mistral
        # Mistral docs: Mistral Medium 3.5 has a 256k context window.
        context_window: 256000
      - id: pixtral-large-latest
        family: pixtral
      - id: pixtral-12b-latest
        family: pixtral
      - id: codestral-latest
        family: codestral
        context_window: 128000
      - id: ministral-8b-latest
        family: ministral
        context_window: 256000
      - id: ministral-3b-latest
        family: ministral
        context_window: 256000
    metadata:
      cost_class: subscription
      capabilities: [coding, reasoning, tool_calling, vision]
      quota_type: subscription

  - id: google-ai-studio
    adapter: middleware
    billing_class: subscription
    base_url: https://ai-studio.google.com/v1
    api_key_env: GOOGLE_AI_STUDIO_API_KEY
    base_url_env: GOOGLE_AI_STUDIO_API_BASE
    protocols: [chat_completions]
    models:
      - id: gemini-3.1-pro-latest
        family: gemini
      - id: gemini-3-flash-latest
        family: gemini
      - id: gemini-2.5-pro-preview
        family: gemini
    metadata:
      cost_class: subscription
      capabilities: [text, vision, tool_calling]
      quota_type: subscription

  # === KOSTENLOS (FREE TIER) ===
  - id: nvidia
    adapter: middleware
    billing_class: free
    base_url: https://api.build.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    base_url_env: NVIDIA_API_BASE
    protocols: [chat_completions]
    models:
      - id: nvidia/nemotron-3-ultra-550b-a55b
        family: nemotron
      - id: nvidia/nemotron-3-super-120b-a12b
        family: nemotron
      - id: nvidia/glm-5.2
        family: glm
      - id: poolside/laguna-xs-2.1
        family: laguna
    metadata:
      cost_class: free
      capabilities: [coding, reasoning, tool_calling]
      quota_type: free_tier

  - id: cerebras
    adapter: middleware
    billing_class: free
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    base_url_env: CEREBRAS_API_BASE
    protocols: [chat_completions]
    discover_models: true
    models:
      - id: gpt-oss-120b
        family: gpt-oss
        context_window: 65536
      - id: gemma-4-31b
        family: gemma
        context_window: 65536
    metadata:
      cost_class: free
      context_window: 65536
      capabilities: [coding, reasoning, tool_calling]
      quota_type: free_tier

  - id: together
    adapter: middleware
    billing_class: free
    base_url: https://api.together.xyz/v1
    api_key_env: TOGETHER_API_KEY
    base_url_env: TOGETHER_API_BASE
    protocols: [chat_completions]
    discover_models: true
    models:
      - id: Prism-ML/Ternary-Bonsai-27B
        family: bonsai
        context_window: 262144
    metadata:
      cost_class: free
      context_window: 262144
      capabilities: [coding, reasoning, tool_calling, vision]
      quota_type: free_tier

  - id: groq
    adapter: middleware
    billing_class: free
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    base_url_env: GROQ_API_BASE
    protocols: [chat_completions]
    discover_models: true
    models:
      - id: llama-3.3-70b-versatile
        family: llama
        context_window: 131072
      - id: openai/gpt-oss-120b
        family: gpt-oss
        context_window: 131072
    metadata:
      cost_class: free
      context_window: 131072
      capabilities: [coding, reasoning, tool_calling]
      quota_type: free_tier

  - id: nous
    adapter: middleware
    billing_class: free
    base_url: https://api.nousresearch.com/v1
    api_key_env: NOUS_API_KEY
    base_url_env: NOUS_API_BASE
    protocols: [chat_completions]
    models:
      - id: nousresearch/laguna-xs-2.1
        family: laguna
      - id: nousresearch/laguna-s-2.1
        family: laguna
      - id: stepfun/step-3.7-flash
        family: stepfun
    metadata:
      cost_class: free
      capabilities: [coding, tool_calling]
      quota_type: free_tier

  # === PAYG (GÜNSTIG) ===
  - id: openrouter
    adapter: middleware
    billing_class: payg
    base_url: https://openrouter.ai/api/v1
    default_base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_API_BASE
    protocols: [chat_completions]
    discover_models: true
    models:
      - id: deepseek/deepseek-v4-flash
        family: deepseek
      - id: deepseek/deepseek-v4-pro
        family: deepseek
    catalog:
      zero_price_only: true
      paid_allowlist:
        - deepseek/deepseek-v4-flash-0731
        - deepseek/deepseek-v4-flash
        - deepseek/deepseek-v4-pro
        - z-ai/glm-5.2
        - z-ai/glm-5.3-flash
        - qwen/qwen3-coder-480b
        - qwen/qwen3-coder-30b
        - z-ai/glm-5.3
        - google/gemini-3.6-flash
    metadata:
      cost_class: payg
      capabilities: [coding, reasoning, tool_calling, vision]
      quota_type: payg

  # === LEGACY ===
  - id: modal
    adapter: middleware
    # GLM on Modal reports its real answer through reasoning_content, which the
    # Anthropic translation would drop, so this lane keeps its dedicated handler.
    messages_translation: false
    api_key_env: MODAL_GLM5_API_KEY
    base_url_env: MODAL_GLM5_API_BASE
    default_base_url: https://api.us-west-2.modal.direct/v1/chat/completions
    models: [glm-5, glm-5.1, zai-org/GLM-5]
    metadata:
      cost_class: payg
      capabilities: [coding, reasoning]
      quota_type: payg

  # Zen's free tier is gated server-side: the request needs the OAuth token of a
  # Console sign-in (a Console API key never qualifies), an OpenCode 1.18+
  # user-agent, a session a real OpenCode client minted, streaming, and a declared
  # tool set. The adapter satisfies all of it, and translates the Anthropic
  # protocol because Zen only serves free traffic on chat completions.
  - id: opencode-zen
    adapter: opencode-zen
    billing_class: subscription
    protocols: [chat_completions, messages]
    base_url: https://opencode.ai/inference/v1
    default_base_url: https://opencode.ai/inference/v1
    credential_file: /data/zen/oauth.json
    credential_file_env: OPENCODE_ZEN_CREDENTIAL_FILE
    token_url: https://opencode.ai/console/auth/device/token
    client_id: opencode-cli
    client_version: "1.18.32"
    serve_command: opencode
    serve_port: 4096
    refresh_skew_ms: 600000
    models:
      - beam-free
      - deepseek-v4.1-flash-free
      - glm-5.3-flash-free
      - jev-1.13-free
      - longcat-2.5-preview-free
      - mimo-v2.6-flash-free
      - nemotron-3.5-lightning-free
      - nemotron-3.5-super-vl-free
      - space-bunny-free
    metadata:
      cost_class: free
      capabilities: [coding, reasoning]
      quota_type: free_tier

routes:
  - provider: opencode-zen
    # The exact free model ids come first: several of them (nemotron-*, glm-*,
    # deepseek-*) also exist on paid providers, and first-match-wins would send
    # a bare id to whichever route is listed first.
    prefixes:
      - opencode-zen/
      - zen/
      - beam-free
      - deepseek-v4.1-flash-free
      - glm-5.3-flash-free
      - jev-1.13-free
      - longcat-2.5-preview-free
      - mimo-v2.6-flash-free
      - nemotron-3.5-lightning-free
      - nemotron-3.5-super-vl-free
      - space-bunny-free

  - provider: cline-oauth
    prefixes: [cline/]
  - provider: modal
    prefixes: [glm-5, zai-org/GLM-5]
  - provider: copilot-auto
    prefixes: [copilot/]
  - provider: openrouter
    prefixes: [openrouter/, or/, free, deepseek-v4, deepseek/]
  - provider: mistral
    prefixes: [mistral/, mistral-]
  - provider: google-ai-studio
    prefixes: [gemini-, google/]
  - provider: nvidia
    prefixes: [nvidia/, nemotron-, poolside/]
  - provider: cerebras
    prefixes: [cerebras/]
  - provider: together
    prefixes: [together/]
  - provider: groq
    prefixes: [groq/]
  - provider: nous
    prefixes: [nousresearch/, laguna-, stepfun/]
  - provider: tokligence
    upstream: anthropic
    prefixes: [claude, minimax-m2]
  - provider: codex-oauth
    prefixes: [gpt-5.6, gpt-6]
  - provider: tokligence
    upstream: openai
    prefixes: [gpt]
  - provider: openrouter
    prefixes: ["*"]

# Model picker visibility served on GET /v1/models. Hidden models stay callable;
# policy.terms explains why they are not offered.
model_picker:
  categories:
    opencode-zen: free
    cline-oauth: free
    ollama-cloud: subscription
    codex-oauth: subscription
    openrouter: paid
    mistral: paid
    modal: paid
    tokligence: routing
  # enabled: false only clears model_picker_enabled in /v1/models. The models
  # keep their routes and stay callable, so each reason below records what the
  # account can actually reach from a Messages-API client rather than a
  # capability the gateway refuses to serve.
  providers:
    ollama-cloud:
      enabled: false
      reason: "Ollama Cloud subscription is not active"
    cline-oauth:
      enabled: false
      reason: "Cline free models accept only OpenAI Chat Completions, not the Messages endpoint"
    openrouter:
      enabled: false
      reason: "OpenRouter workspace has no credit balance"
    modal:
      enabled: false
      reason: "Modal GLM endpoint returns an execution error"
    tokligence:
      enabled: false
      reason: "Internal routing alias rather than a selectable model"
  hide:
    - pattern: "^gpt-5\\.6"
      reason: "Superseded by the gpt-6 generation"
    - pattern: "^gpt-5"
      reason: "Superseded by the gpt-6 generation"
    - pattern: "-embed|-fim"
      reason: "Embedding and fill-in-the-middle models answer no prompts"
    - pattern: "-ocr|-tts|-realtime|-moderation"
      reason: "OCR, speech, realtime-audio and moderation models answer no prompts"
    - pattern: "^pixtral-"
      reason: "Pixtral vision models time out on the Messages endpoint"
    - pattern: "^mistral/labs-leanstral"
      reason: "Preview endpoint returns an execution error"
    - pattern: "^mistral/mistral-large-4(-0)?$"
      reason: "Listing returns an execution error"
    - pattern: "^mistral/voxtral-mini-"
      reason: "Transcription model answers with an empty content array"

profiles:
  agent-default:
    context_window: 128000
    candidates:
      - provider: cline-oauth
        model: cline/cline-free/deepseek-v4.1-flash
      - provider: cline-oauth
        model: cline/cline-free/mimo-v2.6-flash
      - provider: opencode-zen
        model: opencode-zen/kimi-k2.6-free
      - provider: nvidia
        model: nvidia/nemotron-3-super-120b-a12b
      - provider: nvidia
        model: nvidia/nemotron-3-ultra-550b-a55b
      - provider: cerebras
        model: cerebras/gpt-oss-120b
      - provider: cerebras
        model: cerebras/gemma-4-31b
      - provider: together
        model: together/Prism-ML/Ternary-Bonsai-27B
      - provider: groq
        model: groq/llama-3.3-70b-versatile
      - provider: groq
        model: groq/openai/gpt-oss-120b
      - provider: nous
        model: nousresearch/laguna-xs-2.1
      - provider: nous
        model: nousresearch/laguna-s-2.1
      - provider: nous
        model: stepfun/step-3.7-flash
      - provider: mistral
        model: mistral-medium-3-5
      - provider: google-ai-studio
        model: gemini-3-flash-latest
      - provider: copilot-auto
        model: copilot-auto
      - provider: codex-oauth
        model: gpt-5.6-terra
      - provider: openrouter
        model: deepseek/deepseek-v4-flash-0731
      - provider: openrouter
        model: openrouter/free
    max_attempts: 19

  agentic-worker:
    context_window: 128000
    candidates:
      - provider: cline-oauth
        model: cline/cline-free/mimo-v2.6-flash
      - provider: cline-oauth
        model: cline/cline-free/deepseek-v4.1-flash
      - provider: opencode-zen
        model: opencode-zen/kimi-k2.6-free
      - provider: nvidia
        model: nvidia/nemotron-3-super-120b-a12b
      - provider: nvidia
        model: nvidia/nemotron-3-ultra-550b-a55b
      - provider: cerebras
        model: cerebras/gpt-oss-120b
      - provider: cerebras
        model: cerebras/gemma-4-31b
      - provider: together
        model: together/Prism-ML/Ternary-Bonsai-27B
      - provider: groq
        model: groq/llama-3.3-70b-versatile
      - provider: groq
        model: groq/openai/gpt-oss-120b
      - provider: nous
        model: nousresearch/laguna-xs-2.1
      - provider: nous
        model: nousresearch/laguna-s-2.1
      - provider: nous
        model: stepfun/step-3.7-flash
      - provider: google-ai-studio
        model: gemini-3-flash-latest
      - provider: copilot-auto
        model: copilot-auto
      - provider: codex-oauth
        model: gpt-5.6-terra
      - provider: openrouter
        model: deepseek/deepseek-v4-flash-0731
      - provider: openrouter
        model: openrouter/free
    max_attempts: 18

  free-pool:
    candidates:
      - provider: cline-oauth
        model: cline/cline-free/deepseek-v4.1-flash
      - provider: cline-oauth
        model: cline/stealth/space-bunny-alpha
      - provider: cline-oauth
        model: cline/cline-free/gemini-3.8-flash
      - provider: cline-oauth
        model: cline/cline-free/mimo-v2.6-flash
      - provider: opencode-zen
        model: opencode-zen/kimi-k2.6-free
      - provider: nvidia
        model: nvidia/nemotron-3-ultra-550b-a55b
      - provider: nvidia
        model: nvidia/nemotron-3-super-120b-a12b
      - provider: cerebras
        model: cerebras/gpt-oss-120b
      - provider: cerebras
        model: cerebras/gemma-4-31b
      - provider: together
        model: together/Prism-ML/Ternary-Bonsai-27B
      - provider: groq
        model: groq/llama-3.3-70b-versatile
      - provider: groq
        model: groq/openai/gpt-oss-120b
      - provider: nous
        model: nousresearch/laguna-xs-2.1
      - provider: nous
        model: nousresearch/laguna-s-2.1
      - provider: nous
        model: stepfun/step-3.7-flash
      - provider: openrouter
        model: openrouter/free
    max_attempts: 16

# Role aliases are addressed as `role/<name>`. Candidates must declare a
# verified context window (taken from the model entry) and a family; the
# published window is the minimum across candidates.
roles:
  research:
    specialist: true
    instructions: "Research the stated question carefully. Separate verified facts from uncertainty, explain the basis for conclusions, and do not claim tools or source citations that are not present in your response. Return a concise evidence-grounded result."
    candidates:
      - provider: chatgpt-specialist
        model: ui-text
        family: chatgpt-ui

  explore:
    specialist: true
    instructions: "Explore only the supplied context. Explain relevant behavior and dependencies, distinguish observations from inference, and do not claim filesystem or shell access."
    candidates:
      - provider: chatgpt-specialist
        model: ui-text
        family: chatgpt-ui

  plan:
    specialist: true
    instructions: "Produce a bounded, actionable plan from the supplied task and context. State assumptions, dependencies, and acceptance checks; do not claim that any action was executed."
    candidates:
      - provider: chatgpt-specialist
        model: ui-text
        family: chatgpt-ui

  review:
    specialist: true
    instructions: "Critically review only the supplied material. Prioritize concrete correctness issues and evidence, distinguish confirmed defects from questions, and do not claim to run tests or inspect unavailable files."
    candidates:
      - provider: chatgpt-specialist
        model: ui-text
        family: chatgpt-ui

  architecture:
    specialist: true
    instructions: "Analyze the supplied architecture and constraints. Compare bounded alternatives, surface tradeoffs and risks, and mark assumptions clearly. Do not imply authority to make or deploy changes."
    candidates:
      - provider: chatgpt-specialist
        model: ui-text
        family: chatgpt-ui

  synthesis:
    specialist: true
    instructions: "Synthesize only the supplied information. Preserve important distinctions, uncertainty, and provenance; do not invent citations, usage, or missing evidence."
    candidates:
      - provider: chatgpt-specialist
        model: ui-text
        family: chatgpt-ui

  explain:
    specialist: true
    instructions: "Explain the supplied material clearly for the intended reader. Define necessary concepts, preserve technical accuracy, and separate what is known from assumptions. Do not claim access to tools or files that were not supplied."
    candidates:
      - provider: chatgpt-specialist
        model: ui-text
        family: chatgpt-ui

  reasoning:
    specialist: true
    instructions: "Provide a careful, bounded analysis of the supplied task and context. State assumptions, compare relevant alternatives, and give a concise conclusion without claiming implementation, external research, or unavailable evidence."
    candidates:
      - provider: chatgpt-specialist
        model: ui-text
        family: chatgpt-ui

  review-strong:
    fallback: agent-default
    candidates:
      - provider: mistral
        model: mistral-medium-3-5
        family: mistral
      - provider: together
        model: Prism-ML/Ternary-Bonsai-27B
        family: bonsai
      - provider: groq
        model: openai/gpt-oss-120b
        family: gpt-oss

  review-fast:
    fallback: agentic-worker
    candidates:
      - provider: groq
        model: openai/gpt-oss-120b
        family: gpt-oss
      - provider: mistral
        model: ministral-8b-latest
        family: ministral

aliases:
  # Tiered Capability Profiles (Waterfall Failover)
  - id: profile-xhigh
    patterns: [xhigh, reasoning, smartest, architect, oracle]
    provider: codex-oauth
    target: gpt-5.6-sol
    fallback: profile-high

  - id: profile-high
    patterns: [high, coding, smart, engineer]
    provider: codex-oauth
    target: gpt-5.6-terra
    fallback: profile-medium

  - id: profile-medium
    patterns: [medium, worker, standard, implement]
    provider: codex-oauth
    target: gpt-5.6-luna
    fallback: profile-low

  - id: profile-low
    patterns: [low, summarize, extract, cheap, utility]
    provider: mistral
    target: ministral-8b-latest
    fallback: oc/kimi-k2.6

  - id: profile-vision
    patterns: [vision, visual, reviewer, eyes]
    provider: mistral
    target: pixtral-large-latest
    fallback: a-vision-fallback

  # Vision Fallback Chain
  - id: a-vision-fallback
    patterns: [vision-fb-1]
    provider: openrouter
    target: google/gemini-3.6-flash
    fallback: a-vision-fallback-2

  - id: a-vision-fallback-2
    patterns: [vision-fb-2]
    provider: mistral
    target: pixtral-12b-latest
    fallback: tokligence

  # Legacy / Direct Model Aliases
