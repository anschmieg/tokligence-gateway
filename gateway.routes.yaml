version: 2

access:
  public_secret_env: TOKLIGENCE_AUTH_SECRET
  admin_secret_env: TOKLIGENCE_ADMIN_SECRET

providers:
  - id: tokligence
    adapter: tokligence
    default: true
    billing_class: subscription
    protocols: [chat_completions, responses, messages]
    retry_owner: gateway
    base_url: http://127.0.0.1:8081
    api_key_env: TOKLIGENCE_AUTH_SECRET
    upstreams:
      anthropic:
        api_key_env: MINIMAX_API_KEY
        base_url_env: MINIMAX_API_BASE
        default_base_url: https://api.minimax.io/anthropic
      openai:
        api_key_env: OPENAI_API_KEY
        base_url_env: OPENAI_API_BASE
        default_base_url: https://api.openai.com/v1

  - id: codex-oauth
    adapter: oauth-proxy
    enabled_env: CODEX_PROXY_ENABLED
    internal_api_key_env: CODEX_PROXY_API_KEY
    external_base_url_env: CODEX_PROXY_BASE_URL
    auth_dir: /data/cliproxy/auth
    billing_class: subscription
    protocols: [chat_completions, responses, messages]
    retry_owner: adapter
    credential_pool:
      strategy: round-robin
      session_affinity: true
      session_affinity_ttl: 1h
      request_retry: 1
      max_retry_credentials: 2
      max_retry_interval: 30

  # Disabled until the actual account entitlement and API behaviour are verified.
  - id: mistral
    adapter: openai-compatible
    enabled_env: MISTRAL_ENABLED
    api_key_env: MISTRAL_API_KEY
    base_url_env: MISTRAL_API_BASE
    billing_class: subscription
    protocols: [chat_completions]
    retry_owner: gateway

  - id: openrouter
    adapter: openai-compatible
    api_key_env: OPENROUTER_API_KEY
    base_url_env: OPENROUTER_API_BASE
    default_base_url: https://openrouter.ai/api/v1
    billing_class: paygo
    protocols: [chat_completions]
    retry_owner: gateway
    headers:
      HTTP-Referer: https://github.com/tokligence/gateway
      X-Title: Tokligence Gateway

models:
  - id: codex-luna
    provider: codex-oauth
    upstream_model: gpt-5.6-luna
    quality_tier: standard
    context_window: 1050000
    capabilities: { protocols: [chat_completions, responses, messages], streaming: true, tools: true, parallel_tools: true, structured_output: true, reasoning: true, vision: true }
  - id: codex-terra
    provider: codex-oauth
    upstream_model: gpt-5.6-terra
    quality_tier: standard
    context_window: 1050000
    capabilities: { protocols: [chat_completions, responses, messages], streaming: true, tools: true, parallel_tools: true, structured_output: true, reasoning: true, vision: true }
  - id: codex-sol
    provider: codex-oauth
    upstream_model: gpt-5.6-sol
    quality_tier: premium
    context_window: 1050000
    capabilities: { protocols: [chat_completions, responses, messages], streaming: true, tools: true, parallel_tools: true, structured_output: true, reasoning: true, vision: true }
  - id: minimax-m2.1
    provider: tokligence
    upstream_model: MiniMax-M2.1
    quality_tier: economy
    context_window: 200000
    capabilities: { protocols: [chat_completions, responses, messages], streaming: true, tools: false, parallel_tools: false, structured_output: false, reasoning: false, vision: false }
  - id: minimax-m2.5
    provider: tokligence
    upstream_model: MiniMax-M2.5
    quality_tier: standard
    context_window: 200000
    capabilities: { protocols: [chat_completions, responses, messages], streaming: true, tools: false, parallel_tools: false, structured_output: false, reasoning: false, vision: false }
  - id: minimax-m2.7
    provider: tokligence
    upstream_model: MiniMax-M2.7
    quality_tier: standard
    context_window: 200000
    capabilities: { protocols: [chat_completions, responses, messages], streaming: true, tools: false, parallel_tools: false, structured_output: false, reasoning: false, vision: false }

profiles:
  - id: architecture
    public_model: gateway/architecture
    intent: architecture
    max_attempts: 1
    permit_paygo: false
    candidates: [codex-sol]
  - id: execution
    public_model: gateway/execution
    intent: execution
    max_attempts: 1
    permit_paygo: false
    candidates: [minimax-m2.7]
  - id: cheap
    public_model: gateway/cheap
    intent: cheap
    max_attempts: 1
    permit_paygo: false
    candidates: [minimax-m2.1]

aliases:
  - id: claude-opus
    patterns: ["claude-opus-*", "claude-*-opus*"]
    target: gateway/architecture
  - id: claude-sonnet
    patterns: ["claude-sonnet-*", "claude-*-sonnet*"]
    target: gateway/execution
  - id: claude-haiku
    patterns: ["claude-haiku-*", "claude-*-haiku*"]
    target: gateway/cheap
  - id: claude-fable
    patterns: ["claude-fable-*", "claude-*-fable*"]
    target: gateway/architecture
  - id: minimax-m2.7
    patterns: [minimax-m2.7, m2.7]
    target: minimax-m2.7
  - id: minimax-m2.5
    patterns: [minimax-m2.5, m2.5]
    target: minimax-m2.5
  - id: minimax-m2.1
    patterns: [minimax-m2.1, m2.1]
    target: minimax-m2.1

routes:
  - provider: tokligence
    upstream: anthropic
    prefixes: [claude, minimax-m2]
  - provider: tokligence
    upstream: openai
    prefixes: [gpt]

budget:
  monthly_limit_eur: 50
  local_paygo_limit_eur: 20
