# Native CLIProxyAPI v8 provider configuration template (staging).
#
# This is a TEMPLATE, not a live config. It documents the exact native shape
# for the generic-compatible chat providers. To use it, add the entries
# through the NATIVE dashboard (http://127.0.0.1:4195/management.html):
# Providers → OpenAI Compatible → add provider; copy name/base-url/models
# from here, then paste the real API key into the dashboard form. The
# dashboard writes through the backend's validated management API
# (PUT /v8/management/config/api-keys/openai-compatibility), preserving the
# rest of the config. Alternative: use "Config Editor" in the dashboard and
# paste an edited copy of these entries under api-keys.openai-compatibility.
#
# Every `api-key: "REPLACE_WITH_..."` is a placeholder. Never replace a
# placeholder inside this tracked file; never commit a fragment with a real
# key. Real keys are typed only into the native dashboard form.
#
# Shape: entries live under api-keys.openai-compatibility, exactly as the v8
# management API stores and validates them (upstream config.example.yaml at
# v8.0.49, "OpenAI compatibility providers", keys at the line starting
# `#   openai-compatibility:`).
#
# Aliases are EXACT: `name` is the upstream model id, `alias` is what a client
# sends. Nothing is inferred, discovered, or substituted. Add a model only
# when you want it callable; there is no auto-enabling of a provider's whole
# catalog. Free/paid policy is operator-controlled per entry (you choose which
# models to list); no fallback to paid tiers is configured anywhere here.
# Per-provider `request-retry: 0` keeps the no-retry dispatch policy even if
# the global routing.retry.request-retry is ever changed.

api-keys:
  openai-compatibility:

    # --- Mistral chat (generic compatible) ---------------------------------
    # Subscription API key. Specialist APIs (audio/speech/embeddings/OCR/FIM/
    # moderation/realtime) are NOT part of this lane; they stay on the
    # specialist route until separately migrated.
    - name: mistral
      base-url: "https://api.mistral.ai/v1"
      request-retry: 0        # no credential retry rounds beyond the first
      keys:
        - api-key: "REPLACE_WITH_MISTRAL_API_KEY"
      models:
        - name: "mistral-large-latest"
          alias: "mistral/mistral-large-latest"
          max-context-length: 131072
        - name: "mistral-medium-3-5"
          alias: "mistral/mistral-medium-3-5"
          max-context-length: 256000
        - name: "mistral-small-latest"
          alias: "mistral/mistral-small-latest"
        - name: "codestral-latest"
          alias: "mistral/codestral-latest"
          max-context-length: 128000
        # Example alias-only convenience mapping: same upstream model,
        # second client-visible name.
        - name: "mistral-medium-3-5"
          alias: "mistral-medium-3-5"

    # --- OpenRouter (pay-as-you-go) -----------------------------------------
    # Catalog policy from gateway.routes.yaml is operator-enforced here by
    # listing ONLY the models you admit. :free suffix = OpenRouter free tier;
    # a paid id is an explicit paid admission. No wildcard, no "all models".
    - name: openrouter
      base-url: "https://openrouter.ai/api/v1"
      request-retry: 0
      keys:
        - api-key: "REPLACE_WITH_OPENROUTER_API_KEY"
      models:
        # Old lane served "free" through the model_catalog equivalence table
        # (zero_price_only); the native template makes each free admission an
        # explicit :free model id instead.
        - name: "deepseek/deepseek-v4-flash:free"
          alias: "openrouter/deepseek-v4-flash-free"
        - name: "z-ai/glm-5.3-flash:free"
          alias: "openrouter/glm-5.3-flash-free"
        - name: "nvidia/nemotron-3.5-lightning:free"
          alias: "openrouter/nemotron-3.5-lightning-free"
        - name: "minimax/minimax-m3.1-flash:free"
          alias: "openrouter/minimax-m3.1-flash-free"
        - name: "poolside/laguna-s-2.1:free"
          alias: "openrouter/laguna-s-2.1-free"
        # Paid admissions from the old paid_allowlist — uncomment each one
        # only while the budget decision is active:
        # - name: "deepseek/deepseek-v4-flash-0731"
        #   alias: "openrouter/deepseek-v4-flash-0731"
        # - name: "z-ai/glm-5.3-flash"
        #   alias: "openrouter/glm-5.3-flash"
        # - name: "qwen/qwen3-coder-480b"
        #   alias: "openrouter/qwen3-coder-480b"
        # - name: "google/gemini-3.6-flash"
        #   alias: "openrouter/gemini-3.6-flash"

    # --- Cerebras (free tier) ----------------------------------------------
    - name: cerebras
      base-url: "https://api.cerebras.ai/v1"
      request-retry: 0
      keys:
        - api-key: "REPLACE_WITH_CEREBRAS_API_KEY"
      models:
        - name: "gpt-oss-120b"
          alias: "cerebras/gpt-oss-120b"
          max-context-length: 65536
        - name: "gemma-4-31b"
          alias: "cerebras/gemma-4-31b"
          max-context-length: 65536

    # --- Groq (free tier) ----------------------------------------------------
    - name: groq
      base-url: "https://api.groq.com/openai/v1"
      request-retry: 0
      keys:
        - api-key: "REPLACE_WITH_GROQ_API_KEY"
      models:
        - name: "llama-3.3-70b-versatile"
          alias: "groq/llama-3.3-70b-versatile"
          max-context-length: 131072
        - name: "openai/gpt-oss-120b"
          alias: "groq/gpt-oss-120b"
          max-context-length: 131072

    # --- NVIDIA NIM (free tier) ----------------------------------------------
    - name: nvidia
      base-url: "https://api.build.nvidia.com/v1"
      request-retry: 0
      keys:
        - api-key: "REPLACE_WITH_NVIDIA_API_KEY"
      models:
        - name: "nvidia/nemotron-3-ultra-550b-a55b"
          alias: "nvidia/nemotron-3-ultra-550b-a55b"
        - name: "nvidia/nemotron-3-super-120b-a12b"
          alias: "nvidia/nemotron-3-super-120b-a12b"

    # --- Together (free tier) ------------------------------------------------
    - name: together
      base-url: "https://api.together.xyz/v1"
      request-retry: 0
      keys:
        - api-key: "REPLACE_WITH_TOGETHER_API_KEY"
      models:
        - name: "Prism-ML/Ternary-Bonsai-27B"
          alias: "together/ternary-bonsai-27b"
          max-context-length: 262144

    # --- Nous (free tier) ------------------------------------------------------
    - name: nous
      base-url: "https://api.nousresearch.com/v1"
      request-retry: 0
      keys:
        - api-key: "REPLACE_WITH_NOUS_API_KEY"
      models:
        - name: "nousresearch/laguna-xs-2.1"
          alias: "nous/laguna-xs-2.1"
        - name: "nousresearch/laguna-s-2.1"
          alias: "nous/laguna-s-2.1"
        - name: "stepfun/step-3.7-flash"
          alias: "nous/step-3.7-flash"

    # --- Modal hosted GLM (pay-as-you-go, dedicated handler) ------------------
    # NOTE: the old lane keeps a dedicated handler because GLM reports its real
    # answer through reasoning_content. Under the native compat executor this
    # field is not preserved the same way — treat this entry as UNVERIFIED
    # until a bounded admitted live case checks reasoning output. Commented
    # out for that reason.
    # - name: modal
    #   base-url: "https://api.us-west-2.modal.direct/v1"   # note: old route
    #   # pointed at /v1/chat/completions; native compat joins base-url +
    #   # /chat/completions itself, so use the /v1 base here.
    #   request-retry: 0
    #   keys:
    #     - api-key: "REPLACE_WITH_MODAL_GLM5_API_KEY"
    #   models:
    #     - name: "zai-org/GLM-5"
    #       alias: "modal/glm-5"
