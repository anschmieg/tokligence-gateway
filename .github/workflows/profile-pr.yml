name: One-shot agent profile patch

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/simple-agent-profiles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simple-agent-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Extract and run patch script
        shell: bash
        run: |
          awk '
            /python3 <<.PY./ { capture=1; next }
            capture && /^          PY$/ { capture=0; exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-agent-profiles.yml > /tmp/apply-agent-profiles.py
          test -s /tmp/apply-agent-profiles.py
          python3 /tmp/apply-agent-profiles.py
      - run: npm run lint
      - run: npm test
      - name: Commit tested implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-agent-profiles.yml .github/workflows/profile-pr.yml
          git add route-config.mjs routing-planner.mjs provider-adapters.mjs tgw-proxy.mjs gateway.routes.yaml package.json test/agent-profile.test.mjs test/agent-profile-integration.test.mjs
          git commit -m "feat: add simple ordered agent routing profiles"
          git push origin HEAD:feat/simple-agent-profiles
