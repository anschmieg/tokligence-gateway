name: Apply agent profile patch

on:
  push:
    branches: [feat/simple-agent-profiles]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'chore: bootstrap agent profile patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simple-agent-profiles
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply minimal profile routing patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # route-config.mjs: add a small profiles section to the existing v1 config.
          replace_once(
              "route-config.mjs",
              '  if (!Array.isArray(raw.aliases)) throw new Error("routing config aliases must be a list");\n',
              '''  const profiles = Object.entries(raw.profiles || {}).map(([profileId, value], index) => {\n    const id = requireString(profileId, `profiles[${index}].id`);\n    if (!Array.isArray(value?.candidates) || value.candidates.length === 0) {\n      throw new Error(`profile ${id}.candidates must not be empty`);\n    }\n    const candidates = value.candidates.map((candidate, candidateIndex) => {\n      const provider = requireString(candidate?.provider, `profile ${id}.candidates[${candidateIndex}].provider`);\n      if (!providerIds.has(provider)) throw new Error(`profile ${id} references unknown provider: ${provider}`);\n      return {\n        provider,\n        model: requireString(candidate?.model, `profile ${id}.candidates[${candidateIndex}].model`),\n      };\n    });\n    const max_attempts = value?.max_attempts == null ? candidates.length : Number(value.max_attempts);\n    if (!Number.isSafeInteger(max_attempts) || max_attempts < 1 || max_attempts > candidates.length) {\n      throw new Error(`profile ${id}.max_attempts must be between 1 and ${candidates.length}`);\n    }\n    return { id, candidates, max_attempts };\n  });\n  const profileIds = new Set(profiles.map(({ id }) => id.toLowerCase()));\n  if (profileIds.size !== profiles.length) throw new Error("profile IDs must be unique case-insensitively");\n\n  if (!Array.isArray(raw.aliases)) throw new Error("routing config aliases must be a list");\n'''
          )
          replace_once(
              "route-config.mjs",
              '  return { version: 1, access, providers, routes, aliases };\n',
              '  return { version: 1, access, providers, routes, profiles, aliases };\n'
          )
          replace_once(
              "route-config.mjs",
              'export function providerById(config, id) {\n  return config.providers.find((provider) => provider.id === id) || null;\n}\n',
              '''export function providerById(config, id) {\n  return config.providers.find((provider) => provider.id === id) || null;\n}\n\nexport function profileByModel(config, model) {\n  if (!model) return null;\n  return (config.profiles || []).find(({ id }) => id.toLowerCase() === String(model).toLowerCase()) || null;\n}\n'''
          )
          replace_once(
              "route-config.mjs",
              '    routes: config.routes,\n    aliases: config.aliases,\n',
              '    routes: config.routes,\n    profiles: config.profiles,\n    aliases: config.aliases,\n'
          )

          # The copied planner modules expected a different config schema. Make them
          # intentionally profile-only and keep all legacy routing in tgw-proxy.
          Path("routing-planner.mjs").write_text('''import { profileByModel, providerById, providerEnabled } from "./route-config.mjs";\nimport { inspectRequestFeatures } from "./protocol-codecs.mjs";\n\nfunction circuitOpen(runtimeState, provider, model, protocol) {\n  const until = runtimeState?.cooldowns?.get(`${provider}:${model}:${protocol}`) || 0;\n  return until > Date.now();\n}\n\nexport function buildRoutePlan(config, { model, protocol, body }, env = process.env, runtimeState = {}) {\n  if (!model) return { error: { status: 400, code: "missing_model", message: "model is required" } };\n  const profile = profileByModel(config, model);\n  if (!profile) return { error: { status: 404, code: "unknown_profile", message: "Routing profile is not configured" } };\n\n  const required = inspectRequestFeatures(protocol, body);\n  const candidates = [];\n  for (const reference of profile.candidates) {\n    const provider = providerById(config, reference.provider);\n    if (!provider || !providerEnabled(provider, env)) continue;\n    const protocols = Array.isArray(provider.protocols) && provider.protocols.length\n      ? provider.protocols\n      : ["chat_completions"];\n    if (!protocols.includes(protocol)) continue;\n    if (circuitOpen(runtimeState, provider.id, reference.model, protocol)) continue;\n    candidates.push({\n      provider,\n      model: { id: reference.model },\n      upstreamModel: reference.model,\n      protocol,\n      native: true,\n    });\n  }\n\n  const limited = candidates.slice(0, profile.max_attempts);\n  if (!limited.length) {\n    return { error: { status: 503, code: "no_compatible_route", message: "No eligible provider can serve this profile" } };\n  }\n  return {\n    requestedModel: model,\n    publicModel: profile.id,\n    profile: profile.id,\n    required,\n    deadline: Date.now() + Number(env.GATEWAY_REQUEST_TIMEOUT_MS || 120000),\n    maxAttempts: limited.length,\n    candidates: limited,\n  };\n}\n''')

          # Fix the generic provider adapter for the OpenRouter/Mistral middleware
          # providers used by these profiles.
          Path("provider-adapters.mjs").write_text('''import http from "node:http";\nimport https from "node:https";\nconst FORWARD_HEADERS = ["accept", "anthropic-beta", "anthropic-version", "content-type", "user-agent", "x-request-id"];\n\nfunction baseUrl(provider, env) {\n  if (provider.adapter === "tokligence") return new URL(`http://${env.TGW_HOST || "127.0.0.1"}:${env.TGW_PORT || 8081}`);\n  const value = (provider.base_url_env && env[provider.base_url_env]) || provider.base_url || provider.default_base_url;\n  return value ? new URL(value) : null;\n}\n\nfunction endpointSuffix(pathname) {\n  if (pathname.includes("/chat/completions")) return "chat/completions";\n  if (pathname.includes("/responses")) return "responses";\n  if (pathname.includes("/messages")) return "messages";\n  return null;\n}\n\nfunction requestUrl(candidate, path, env) {\n  const incoming = new URL(path, "http://gateway.local");\n  if (candidate.provider.adapter === "oauth-proxy") {\n    const target = new URL(env[candidate.provider.external_base_url_env] || "http://127.0.0.1:8317");\n    target.pathname = `${target.pathname.replace(/\\/$/, "")}${incoming.pathname.replace(/^\\/anthropic/, "")}`;\n    target.search = incoming.search;\n    return target;\n  }\n  const base = baseUrl(candidate.provider, env);\n  if (!base) throw new Error("Provider is not configured");\n  const target = new URL(base.toString());\n  const suffix = endpointSuffix(incoming.pathname);\n  target.pathname = suffix\n    ? `${target.pathname.replace(/\\/$/, "")}/${suffix}`\n    : `${target.pathname.replace(/\\/$/, "")}${incoming.pathname}`;\n  target.search = incoming.search;\n  return target;\n}\n\nexport function startAttempt({ candidate, req, path, body, env = process.env, signal }) {\n  const target = requestUrl(candidate, path, env);\n  const client = target.protocol === "https:" ? https : http;\n  const headers = { "content-type": "application/json", "content-length": String(body.length), ...candidate.provider.headers };\n  for (const name of FORWARD_HEADERS) if (req.headers[name] !== undefined) headers[name] = req.headers[name];\n  if (candidate.provider.adapter === "oauth-proxy") {\n    headers.authorization = `Bearer ${env[candidate.provider.internal_api_key_env]}`;\n  } else if (candidate.provider.api_key_env && env[candidate.provider.api_key_env]) {\n    headers.authorization = `Bearer ${env[candidate.provider.api_key_env]}`;\n  } else if (req.headers.authorization) {\n    headers.authorization = req.headers.authorization;\n  }\n\n  return new Promise((resolve, reject) => {\n    const upstream = client.request({ protocol: target.protocol, hostname: target.hostname, port: target.port || undefined, path: `${target.pathname}${target.search}`, method: "POST", headers }, (response) => resolve({ response, upstream, target }));\n    upstream.once("error", reject);\n    signal?.addEventListener("abort", () => upstream.destroy(signal.reason), { once: true });\n    upstream.end(body);\n  });\n}\n''')

          # tgw-proxy: route only explicit profile names through planner/executor.
          replace_once(
              "tgw-proxy.mjs",
              '  providerById,\n  providerEnabled,\n  publicRoutingConfig,\n',
              '  providerById,\n  providerEnabled,\n  profileByModel,\n  publicRoutingConfig,\n'
          )
          replace_once(
              "tgw-proxy.mjs",
              'import { COPILOT_AUTO_MODEL, createCopilotAutoAdapter } from "./copilot-auto.mjs";\n',
              'import { COPILOT_AUTO_MODEL, createCopilotAutoAdapter } from "./copilot-auto.mjs";\nimport { buildRoutePlan } from "./routing-planner.mjs";\nimport { executeRoutePlan } from "./request-executor.mjs";\n'
          )
          replace_once(
              "tgw-proxy.mjs",
              'const ROUTING = loadRoutingConfig(ROUTING_CONFIG_PATH);\n',
              'const ROUTING = loadRoutingConfig(ROUTING_CONFIG_PATH);\nconst PROFILE_RUNTIME_STATE = { cooldowns: new Map() };\n'
          )
          replace_once(
              "tgw-proxy.mjs",
              '''function resolveModel(model) {\n  return PREFERENCES.resolve(model, resolveConfiguredAlias);\n}\n''',
              '''function resolveModel(model) {\n  return PREFERENCES.resolve(model, resolveConfiguredAlias);\n}\n\nfunction handleProfileRequest(req, res, parsed, protocol) {\n  const profile = profileByModel(ROUTING, parsed?.model);\n  if (!profile) return false;\n  const plan = buildRoutePlan(\n    ROUTING,\n    { model: parsed.model, protocol, body: parsed },\n    process.env,\n    PROFILE_RUNTIME_STATE,\n  );\n  if (plan.error) {\n    res.writeHead(plan.error.status, { "Content-Type": "application/json" });\n    res.end(JSON.stringify({ error: plan.error }));\n    return true;\n  }\n  executeRoutePlan({\n    plan,\n    req,\n    res,\n    path: req.url,\n    body: parsed,\n    env: process.env,\n    runtimeState: PROFILE_RUNTIME_STATE,\n  }).catch((error) => {\n    if (res.headersSent) {\n      res.destroy(error);\n      return;\n    }\n    res.writeHead(502, { "Content-Type": "application/json" });\n    res.end(JSON.stringify({ error: "Profile routing failed" }));\n  });\n  return true;\n}\n'''
          )
          replace_once(
              "tgw-proxy.mjs",
              '      const model = resolveModel(parsed.model);\n\n      if (model === COPILOT_AUTO_MODEL) {\n',
              '      if (handleProfileRequest(req, res, parsed, "chat_completions")) return;\n\n      const model = resolveModel(parsed.model);\n\n      if (model === COPILOT_AUTO_MODEL) {\n'
          )

          # Source-of-truth profiles and current model IDs.
          replace_once(
              "gateway.routes.yaml",
              '      - mistral-small-latest\n',
              '      - mistral-small-latest\n      - mistral-medium-3-5\n'
          )
          replace_once(
              "gateway.routes.yaml",
              '        - deepseek/deepseek-v4-flash-0731\n',
              '        - deepseek/deepseek-v4-flash-0731\n        - deepseek/deepseek-v4-flash\n        - deepseek/deepseek-v4-pro\n        - z-ai/glm-5.2\n'
          )
          replace_once(
              "gateway.routes.yaml",
              'aliases:\n',
              '''profiles:\n  agent-default:\n    candidates:\n      - provider: openrouter\n        model: deepseek/deepseek-v4-flash\n      - provider: mistral\n        model: mistral-medium-3-5\n      - provider: openrouter\n        model: z-ai/glm-5.2\n      - provider: codex-oauth\n        model: gpt-5.6-terra\n    max_attempts: 4\n\n  agentic-worker:\n    candidates:\n      - provider: mistral\n        model: mistral-medium-3-5\n      - provider: openrouter\n        model: z-ai/glm-5.2\n      - provider: openrouter\n        model: deepseek/deepseek-v4-pro\n      - provider: codex-oauth\n        model: gpt-5.6-terra\n    max_attempts: 4\n\naliases:\n'''
          )

          # Unit tests for parsing/order/circuit skipping.
          Path("test/agent-profile.test.mjs").write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nimport { parseRoutingConfig, profileByModel } from "../route-config.mjs";\nimport { buildRoutePlan } from "../routing-planner.mjs";\n\nconst config = parseRoutingConfig(fs.readFileSync("gateway.routes.yaml", "utf8"));\nconst env = {\n  OPENROUTER_API_KEY: "or-key",\n  MISTRAL_API_KEY: "mistral-key",\n  CODEX_PROXY_ENABLED: "true",\n  CODEX_PROXY_API_KEY: "codex-key",\n};\n\ntest("agent profiles preserve deterministic candidate order", () => {\n  assert.deepEqual(profileByModel(config, "agent-default").candidates, [\n    { provider: "openrouter", model: "deepseek/deepseek-v4-flash" },\n    { provider: "mistral", model: "mistral-medium-3-5" },\n    { provider: "openrouter", model: "z-ai/glm-5.2" },\n    { provider: "codex-oauth", model: "gpt-5.6-terra" },\n  ]);\n  assert.equal(profileByModel(config, "AGENTIC-WORKER").candidates[0].provider, "mistral");\n});\n\ntest("route planner builds the ordered fallback chain", () => {\n  const plan = buildRoutePlan(config, {\n    model: "agent-default",\n    protocol: "chat_completions",\n    body: { messages: [{ role: "user", content: "hello" }] },\n  }, env, { cooldowns: new Map() });\n  assert.equal(plan.error, undefined);\n  assert.deepEqual(plan.candidates.map(({ provider, upstreamModel }) => [provider.id, upstreamModel]), [\n    ["openrouter", "deepseek/deepseek-v4-flash"],\n    ["mistral", "mistral-medium-3-5"],\n    ["openrouter", "z-ai/glm-5.2"],\n    ["codex-oauth", "gpt-5.6-terra"],\n  ]);\n});\n\ntest("route planner skips a candidate while its circuit is open", () => {\n  const cooldowns = new Map([[\n    "openrouter:deepseek/deepseek-v4-flash:chat_completions",\n    Date.now() + 60_000,\n  ]]);\n  const plan = buildRoutePlan(config, {\n    model: "agent-default",\n    protocol: "chat_completions",\n    body: { messages: [] },\n  }, env, { cooldowns });\n  assert.equal(plan.candidates[0].provider.id, "mistral");\n  assert.equal(plan.candidates[0].upstreamModel, "mistral-medium-3-5");\n});\n''')

          # End-to-end 429 -> Mistral fallback test through the real façade.
          Path("test/agent-profile-integration.test.mjs").write_text('''import assert from "node:assert/strict";\nimport { spawn } from "node:child_process";\nimport { once } from "node:events";\nimport http from "node:http";\nimport path from "node:path";\nimport { fileURLToPath } from "node:url";\nimport test from "node:test";\n\nconst projectRoot = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");\n\nasync function listen(server) {\n  server.listen(0, "127.0.0.1");\n  await once(server, "listening");\n  return server.address().port;\n}\nfunction close(server) { return new Promise((resolve) => server.close(resolve)); }\nasync function readJson(req) {\n  const chunks = [];\n  for await (const chunk of req) chunks.push(chunk);\n  return JSON.parse(Buffer.concat(chunks).toString() || "{}");\n}\nfunction waitForProxy(child) {\n  return new Promise((resolve, reject) => {\n    const timer = setTimeout(() => reject(new Error("proxy startup timed out")), 5000);\n    let output = "";\n    const onData = (chunk) => {\n      output += chunk.toString();\n      const match = output.match(/tgw-proxy :(\\d+)/);\n      if (!match) return;\n      clearTimeout(timer);\n      child.stdout.off("data", onData);\n      resolve(Number(match[1]));\n    };\n    child.stdout.on("data", onData);\n    child.once("exit", (code) => { clearTimeout(timer); reject(new Error(`proxy exited with ${code}: ${output}`)); });\n  });\n}\n\ntest("agent-default falls back from OpenRouter 429 to Mistral", async (t) => {\n  const openrouterRequests = [];\n  const mistralRequests = [];\n  const openrouter = http.createServer(async (req, res) => {\n    openrouterRequests.push({ path: req.url, headers: req.headers, body: await readJson(req) });\n    res.writeHead(429, { "Content-Type": "application/json", "Retry-After": "1" });\n    res.end(JSON.stringify({ error: "rate limited" }));\n  });\n  const mistral = http.createServer(async (req, res) => {\n    const body = await readJson(req);\n    mistralRequests.push({ path: req.url, headers: req.headers, body });\n    res.writeHead(200, { "Content-Type": "application/json" });\n    res.end(JSON.stringify({\n      id: "chatcmpl-test",\n      object: "chat.completion",\n      model: body.model,\n      choices: [{ index: 0, message: { role: "assistant", content: "mistral ok" }, finish_reason: "stop" }],\n    }));\n  });\n  const openrouterPort = await listen(openrouter);\n  const mistralPort = await listen(mistral);\n\n  const child = spawn(process.execPath, ["tgw-proxy.mjs"], {\n    cwd: projectRoot,\n    env: {\n      ...process.env,\n      PROXY_PORT: "0",\n      TOKLIGENCE_AUTH_SECRET: "public-secret",\n      TOKLIGENCE_ADMIN_SECRET: "admin-secret",\n      OPENROUTER_API_KEY: "or-key",\n      OPENROUTER_API_BASE: `http://127.0.0.1:${openrouterPort}/api/v1`,\n      MISTRAL_API_KEY: "mistral-key",\n      MISTRAL_API_BASE: `http://127.0.0.1:${mistralPort}/v1`,\n      CODEX_PROXY_ENABLED: "false",\n      CODEX_PROXY_API_KEY: "",\n      OPENCODE_API_KEY: "",\n      MODAL_GLM5_API_KEY: "",\n      MINIMAX_API_KEY: "",\n    },\n    stdio: ["ignore", "pipe", "pipe"],\n  });\n  t.after(async () => {\n    child.kill("SIGTERM");\n    await Promise.all([close(openrouter), close(mistral)]);\n  });\n\n  const proxyPort = await waitForProxy(child);\n  const response = await fetch(`http://127.0.0.1:${proxyPort}/v1/chat/completions`, {\n    method: "POST",\n    headers: { Authorization: "Bearer public-secret", "Content-Type": "application/json" },\n    body: JSON.stringify({\n      model: "agent-default",\n      messages: [{ role: "user", content: "hello" }],\n      stream: false,\n    }),\n  });\n\n  assert.equal(response.status, 200);\n  assert.equal(response.headers.get("x-gateway-model"), "agent-default");\n  assert.equal(response.headers.get("x-gateway-provider"), "mistral");\n  const data = await response.json();\n  assert.equal(data.choices[0].message.content, "mistral ok");\n  assert.equal(openrouterRequests.length, 1);\n  assert.equal(openrouterRequests[0].path, "/api/v1/chat/completions");\n  assert.equal(openrouterRequests[0].headers.authorization, "Bearer or-key");\n  assert.equal(openrouterRequests[0].body.model, "deepseek/deepseek-v4-flash");\n  assert.equal(mistralRequests.length, 1);\n  assert.equal(mistralRequests[0].path, "/v1/chat/completions");\n  assert.equal(mistralRequests[0].headers.authorization, "Bearer mistral-key");\n  assert.equal(mistralRequests[0].body.model, "mistral-medium-3-5");\n});\n''')

          # Include the newly active routing modules/tests in the syntax check.
          replace_once(
              "package.json",
              '"lint": "node --check tgw-proxy.mjs && node --check copilot-auto.mjs',
              '"lint": "node --check tgw-proxy.mjs && node --check routing-planner.mjs && node --check request-executor.mjs && node --check provider-adapters.mjs && node --check copilot-auto.mjs'
          )
          replace_once(
              "package.json",
              'node --check test/copilot-auto.test.mjs"',
              'node --check test/copilot-auto.test.mjs && node --check test/agent-profile.test.mjs && node --check test/agent-profile-integration.test.mjs"'
          )
          PY
      - run: npm run lint
      - run: npm test
      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add route-config.mjs routing-planner.mjs provider-adapters.mjs tgw-proxy.mjs gateway.routes.yaml package.json test/agent-profile.test.mjs test/agent-profile-integration.test.mjs
          git commit -m "feat: add simple ordered agent routing profiles"
          git push origin HEAD:feat/simple-agent-profiles
